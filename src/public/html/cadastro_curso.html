<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro de Curso </title>

</head>
<body>

    <h2> Cadastrar Curso  </h2>
    <form action="/curso" id="cadastro_curso">

        Codigo: <input type="text" id="cod" name="cod">
        Nome: <input type="text" id="nome_curso" name="nome_curso">
        Carga horária <input type="text" id="c_h" name="c_h">
        tipo: <input type="text" id="tipo" name="tipo">
        <button type="submit"> Salvar </button>

    </form>

</body>
</html>
